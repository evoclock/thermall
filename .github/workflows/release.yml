name: Release

# Trigger on tag push matching v*.*.*.
# Builds the wheel + sdist as a sanity check and uploads them as
# workflow artifacts. thermall is distributed via GitHub install
# (pipx install git+https://github.com/evoclock/thermall.git), not
# PyPI; this workflow exists to verify each tagged release builds
# cleanly and bundles the icons.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build distributions
        run: uv build

      - name: Verify wheel includes bundled icons
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          for size in 16 24 32 48 64 128 256 512; do
            unzip -l "$wheel" | grep -q "thermall/icons/${size}x${size}/thermall.png" \
              || (echo "Missing ${size}x${size} icon in wheel" && exit 1)
          done
          unzip -l "$wheel" | grep -q "thermall/icons/thermall.svg" \
            || (echo "Missing source SVG in wheel" && exit 1)
          echo "[OK] wheel contains all PNG sizes + source SVG"

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
