[project]
name = "thermall"
version = "0.1.2"
description = "Terminal UI dashboard for cooling-system observability on Linux: fans, motherboard sensors, CPU/GPU/NVMe temperatures, threshold-graded warnings."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Julen Gamboa", email = "j.a.r.gamboa@gmail.com" },
]
keywords = ["tui", "monitoring", "fans", "temperatures", "sensors", "nvidia", "nvme", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.7",
]

[project.urls]
Homepage = "https://github.com/evoclock/thermall"
Repository = "https://github.com/evoclock/thermall"
Issues = "https://github.com/evoclock/thermall/issues"

[project.scripts]
thermall = "thermall.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"] # allow assert False in test stubs

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise real subprocess calls (slow; skipped in CI by default)",
]

[tool.coverage.run]
source = ["thermall"]
branch = true
omit = [
    "src/thermall/__main__.py",
    "src/thermall/dashboard.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
