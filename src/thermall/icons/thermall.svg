<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges" role="img" aria-label="Fan blowing air toward thermometer icon">
  <title>Fan cooling thermometer</title>
  <desc>Pixel-art desktop icon: a fan blowing airflow toward a thermometer, with transparent background.</desc>

  <!-- Palette:
       outline: #1b1b1b
       body:    #f6efdd
       heat:    #ff5b18
       cool:    #48bde8
  -->

  <!-- Fan housing -->
  <rect x="3" y="18" width="2" height="8" fill="#1b1b1b"/>
  <rect x="5" y="17" width="2" height="10" fill="#f6efdd"/>
  <rect x="7" y="18" width="1" height="8" fill="#1b1b1b"/>

  <rect x="11" y="10" width="10" height="1" fill="#1b1b1b"/>
  <rect x="8" y="11" width="16" height="2" fill="#1b1b1b"/>
  <rect x="6" y="13" width="20" height="3" fill="#1b1b1b"/>
  <rect x="5" y="16" width="22" height="10" fill="#1b1b1b"/>
  <rect x="6" y="26" width="20" height="4" fill="#1b1b1b"/>
  <rect x="8" y="30" width="16" height="2" fill="#1b1b1b"/>
  <rect x="11" y="32" width="10" height="1" fill="#1b1b1b"/>

  <rect x="11" y="11" width="10" height="1" fill="#f6efdd"/>
  <rect x="8" y="13" width="16" height="3" fill="#f6efdd"/>
  <rect x="7" y="16" width="18" height="10" fill="#f6efdd"/>
  <rect x="8" y="26" width="16" height="3" fill="#f6efdd"/>
  <rect x="11" y="29" width="10" height="2" fill="#f6efdd"/>

  <!-- Fan blades -->
  <rect x="15" y="14" width="4" height="4" fill="#1b1b1b"/>
  <rect x="14" y="15" width="5" height="3" fill="#1b1b1b"/>
  <rect x="10" y="22" width="6" height="4" fill="#1b1b1b"/>
  <rect x="11" y="21" width="4" height="5" fill="#1b1b1b"/>
  <rect x="19" y="21" width="5" height="5" fill="#1b1b1b"/>
  <rect x="18" y="20" width="5" height="4" fill="#1b1b1b"/>

  <!-- Fan hub -->
  <rect x="15" y="19" width="4" height="4" fill="#1b1b1b"/>
  <rect x="16" y="20" width="2" height="2" fill="#f6efdd"/>

  <!-- Airflow -->
  <rect x="28" y="17" width="5" height="1" fill="#1b1b1b"/>
  <rect x="33" y="16" width="1" height="1" fill="#1b1b1b"/>
  <rect x="34" y="15" width="1" height="2" fill="#1b1b1b"/>
  <rect x="33" y="14" width="1" height="1" fill="#1b1b1b"/>

  <rect x="27" y="22" width="9" height="1" fill="#1b1b1b"/>
  <rect x="36" y="21" width="1" height="1" fill="#1b1b1b"/>
  <rect x="37" y="22" width="1" height="2" fill="#1b1b1b"/>
  <rect x="36" y="24" width="1" height="1" fill="#1b1b1b"/>

  <rect x="28" y="27" width="6" height="1" fill="#1b1b1b"/>
  <rect x="34" y="28" width="1" height="1" fill="#1b1b1b"/>
  <rect x="35" y="29" width="1" height="1" fill="#1b1b1b"/>
  <rect x="34" y="30" width="1" height="1" fill="#1b1b1b"/>

  <rect x="26" y="18" width="1" height="1" fill="#1b1b1b"/>
  <rect x="26" y="23" width="1" height="1" fill="#1b1b1b"/>
  <rect x="38" y="18" width="1" height="1" fill="#1b1b1b"/>
  <rect x="38" y="25" width="1" height="1" fill="#1b1b1b"/>

  <!-- Thermometer outline and body -->
  <rect x="40" y="10" width="3" height="1" fill="#1b1b1b"/>
  <rect x="39" y="11" width="5" height="1" fill="#1b1b1b"/>
  <rect x="38" y="12" width="7" height="14" fill="#1b1b1b"/>
  <rect x="37" y="26" width="9" height="4" fill="#1b1b1b"/>
  <rect x="36" y="30" width="11" height="7" fill="#1b1b1b"/>
  <rect x="38" y="37" width="7" height="2" fill="#1b1b1b"/>

  <rect x="40" y="12" width="3" height="14" fill="#f6efdd"/>
  <rect x="39" y="13" width="5" height="13" fill="#f6efdd"/>
  <rect x="39" y="27" width="5" height="3" fill="#f6efdd"/>
  <rect x="38" y="30" width="7" height="6" fill="#f6efdd"/>
  <rect x="40" y="36" width="3" height="1" fill="#f6efdd"/>

  <!-- Thermometer ticks -->
  <rect x="43" y="15" width="2" height="1" fill="#1b1b1b"/>
  <rect x="43" y="18" width="2" height="1" fill="#1b1b1b"/>
  <rect x="43" y="21" width="2" height="1" fill="#1b1b1b"/>

  <!-- Thermometer fill -->
  <rect x="41" y="24" width="2" height="8" fill="#ff5b18"/>
  <rect x="39" y="31" width="6" height="5" fill="#ff5b18"/>
  <rect x="40" y="30" width="4" height="1" fill="#ff5b18"/>
  <rect x="40" y="33" width="1" height="1" fill="#f6efdd"/>

  <!-- Cooling sparkles -->
  <rect x="45" y="16" width="1" height="5" fill="#48bde8"/>
  <rect x="43" y="18" width="5" height="1" fill="#48bde8"/>
  <rect x="46" y="25" width="1" height="3" fill="#48bde8"/>
  <rect x="45" y="26" width="3" height="1" fill="#48bde8"/>
</svg>
